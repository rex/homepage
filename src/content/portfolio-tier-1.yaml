    pitch: A native macOS app that frames any image to your display's exact pixels — ultrawide, multi-monitor, 5K2K — and sets it as wallpaper in one click.
    hook: The “Quality Verdict” engine measures real sharpness via variance-of-Laplacian on a grayscale downsample, computes exact resolution headroom against the display's native panel-pixel sum, and estimates compression as encoded bits-per-pixel — composited into one honest 0–100 score. Paired with on-device Vision attention-saliency auto-framing, all off-main-actor under Swift 6 strict concurrency.
    blurb: "Wideframe is a native macOS app built to solve a real annoyance: no wallpaper ever fits an ultrawide or multi-monitor setup without stretching or letterboxing. It frames any image to your display's exact pixels, uses on-device Vision saliency to auto-find the subject, and gives you an honest “Quality Verdict” — a composite of resolution headroom, measured sharpness, and compression that tells you whether an image will actually look good before you commit. SwiftUI + Swift 6 strict concurrency, StoreKit 2 monetization, App-Sandboxed and Mac-App-Store-ready, with a full marketing site at wideframe.studio."
