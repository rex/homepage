    hook: "The database IS the product and the API — ~8,400 lines of SQL implement a degrade-safe safe_to_spend engine behind an inviolable data-provenance mandate: every one of 335 columns across 30 tables carries a machine-read COMMENT documenting its origin and class, enforced by a fail-closed gate. Paired with a Playwright headless scraper that reverse-engineers a POS with no public API via fingerprint-aware sessions and email-code 2FA."
    blurb: "Cheddar is a full personal-finance ecosystem built for someone whose tip-heavy, variable income makes “can I afford this?” genuinely hard to answer. It's five coordinated repos: a Supabase/Postgres backend where security-definer functions ARE the API (tables sealed, RLS on), a React SPA and a native Android app as the daily surfaces, and a FastAPI homelab server that scrapes a booking POS with a headless browser, syncs the bank via Plaid, and parses email. The headline “safe to spend” number is deliberately conservative and shows its receipts, and every column in the schema has enforced, documented provenance so no number is ever a black box."
