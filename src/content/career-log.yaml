    role: Software Engineer II
    employer: Topgolf
    location: Dallas, TX
    summary: >
      Full-stack engineer on real-time gameplay systems, developer tooling,
      and venue deployment workflows for 50+ locations. Shipped the Virtual
      Courses game UI, helped virtualize the venue software stack, and
      internationalized gameplay across regions. Nov 2015 — May 2020.

