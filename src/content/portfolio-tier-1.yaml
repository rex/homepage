  - rank: 1
    id: outageforge
    tier: 1
    name: OutageForge
    bucket: DevOps product
    tag: DevOps / SRE
    year: "2026"
    status: active
    status_kind: operational
    stack:
      - TypeScript
      - React
      - Vite
      - Fastify
      - xterm.js
      - WASM/WASI
      - Supabase
      - Vitest + fast-check
    pitch: A deterministic “flight simulator” for infrastructure — practice on-call incidents and replay them frame-for-frame.
    hook: The whole simulation is a pure, seeded, event-sourced reducer that never touches Math.random() or the wall clock — so a run is fully described by seed + input log. That one property buys time-travel debugging, lockstep multiplayer, free replay-based anti-cheat, and total observability, proven by adversarial property-based determinism tests.
    blurb: OutageForge is a deterministic DevOps/SRE incident simulator — a flight simulator for infrastructure. It models a Kubernetes/Linux/network topology as a pure, event-sourced, seeded simulation and emulates the real tools (a WASM shell, real kubectl) at the surface, so you practice on-call incidents against realistic outages and get a causal, gamified debrief that levels up an RPG skill tree. Because the engine never touches randomness or wall-clock time, every run is reproducible from seed + input log — giving time-travel debugging, lockstep multiplayer where the server only orders inputs, and free anti-cheat, all proven with property-based tests. ~68K lines of TypeScript, 23 ADRs of design rigor, shipped through a green-gated blue-green pipeline.
    metrics:
      - v: 68K
        k: lines TS
      - v: "23"
        k: ADRs
      - v: "187"
        k: test files
    art: terminal
    visual: War Room + architecture diagram
    detail:
      form: longform
      intro: >
        A flight simulator for on-call: a deterministic, event-sourced incident
        sandbox where every outage is reproducible frame-for-frame — practice
        production without production.
      highlights:
        - Pure seeded reducer — no Math.random(), no wall clock; a run is fully described by seed + input log
        - Time-travel debugging, lockstep multiplayer, and replay anti-cheat all fall out of one determinism property
        - A WASM shell and real kubectl at the surface; a causal, gamified debrief and RPG skill tree at the end
        - 23 ADRs of design rigor, adversarial property-based determinism tests, blue-green gated deploys
      sections:
        - label: why
          title: Practice production without production
          body: >
            On-call skill is usually built in anger, at 3am, against real customers.
            OutageForge models a Kubernetes/Linux/network topology as a pure simulation
            and emulates the real tools at the surface, so the reps are realistic but
            the blast radius is zero.
        - label: architecture
          title: One pure reducer; everything else is projection
          body: >
            The simulation core is a seeded, event-sourced reducer that never touches
            randomness or wall-clock time. A run is fully described by its seed plus the
            input log — which buys time-travel debugging, lockstep multiplayer where the
            server only orders inputs, and replay-based anti-cheat, for free.
        - label: process
          title: ADR-driven, property-tested
          body: >
            Twenty-three architecture decision records anchor the design, and the
            determinism property is enforced adversarially — property-based tests try to
            break reproducibility on every change. Deploys ship through a green-gated
            blue-green pipeline.
      evolution:
        - year: "2026"
          note: Determinism kernel, WASM shell, and causal debrief landed; blue-green pipeline gated on the property suite.
      gallery: []
