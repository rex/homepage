# Career Log
# Format: reverse chronological, versioned, changelog-style
# Each entry has version, date range, role, employer, 1-3 line summary
# Render as monospace block, tabular-figures for versions, italic serif for descriptions
#
# Dates verified against LinkedIn 2026-05-14. Pre-2012 entries (v0.x) are
# Pierce-private (not on LinkedIn) and reflect his memory of those roles.

entries:
  - version: v8.x
    period: 2020 — present
    role: Senior DevOps Engineer
    title_arc: DevOps Engineer (Contract) → Senior DevOps Engineer
    employer: Drive Shack / Puttery
    location: Dallas, TX
    summary: >
      Started as a contract DevOps Engineer in May 2020, converted to
      Senior DevOps Engineer full-time in April 2021. Own DevOps,
      automation, cloud, CI/CD, and venue platform reliability across
      the org. Built and scaled a multi-venue Kubernetes/Rancher
      platform, designed company-wide Ansible for Windows + Linux, and
      led an AWS cleanup that cut spend by roughly 64% without
      sacrificing reliability.

  - version: vol/22
    kind: volunteer
    period: 2022 — 2023
    role: Director of Communications
    employer: DFW Curling Club
    location: Dallas, TX
    summary: >
      Volunteer leadership of communications, member engagement, and
      event coordination for the Dallas-Fort Worth area's curling
      club. May 2022 — Nov 2023.

  - version: v7.x
