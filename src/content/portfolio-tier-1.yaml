    pitch: A five-repo, GitOps homelab platform run like a real production environment — declarative inventory, 60+ Ansible roles, a full HA tier, and an event-sourced deploy pipeline.
    hook: "The deploy pipeline is genuinely event-sourced: a raw Gitea event store (UNIQUE delivery_id → retries are idempotent no-ops), JSONB payloads, and read-side projections over both Postgres and SQLite. Not a “webhook fires a redeploy” script but a proper CQRS-style event log with a synthesized state view."
    blurb: A self-hosted platform that runs my entire homelab like a real production environment. A declarative YAML inventory is the single source of truth; ~60 Ansible roles converge six hosts including a full HA data tier (Patroni Postgres + etcd + keepalived VIPs, clustered EMQX, HA MinIO/InfluxDB/Grafana/Prometheus). A TypeScript control plane consumes Gitea webhooks into an idempotent, event-sourced deploy log and drives Portainer, with a 28-component React operator console over deploys, drift, secrets, and hosts. Five coordinated repos, 1,000+ commits, ADRs, CI, and Molecule tests.
