name: analytics

# Daily run that:
#   - Pulls CloudFront access logs from the log bucket
#   - Runs goaccess to produce an HTML report
#   - Uploads the report to s3://<site-bucket>/admin/stats/
#   - (Phase 3) writes a per-day rollup JSON to s3://<site-bucket>/admin/data/
#   - Invalidates /admin/* on CloudFront so the new files are visible
#
# /admin/* is gated by HTTP Basic Auth in the CloudFront Function. The
# expected header value is baked into the function at `cdk deploy` time.
#
# Required GitHub repository secrets:
#   - AWS_DEPLOY_ROLE_ARN  : OIDC deploy role (already used by deploy.yml)
#   - AWS_LOG_BUCKET       : Name of the CloudFront access-log bucket
#                            (CDK output: PiercemooreSiteStack.LogBucketName)
#   - AWS_SITE_BUCKET      : Site content bucket (already used by deploy.yml)
#   - AWS_DISTRIBUTION_ID  : CloudFront distribution id (already used by deploy.yml)

on:
  schedule:
    # 08:00 UTC daily = 03:00 CDT / 02:00 CST. After yesterday's logs
    # have stopped trickling in.
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install goaccess + jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends goaccess jq

      - name: Sync CloudFront access logs locally
        run: |
          mkdir -p logs
          aws s3 sync "s3://${{ secrets.AWS_LOG_BUCKET }}/cf-logs/" ./logs/ \
            --no-progress \
            --exclude "*" --include "*.gz"

          echo "Log files retrieved:"
          ls -la logs/ | head -20
          echo "Total: $(ls logs/*.gz 2>/dev/null | wc -l) gz files"

      - name: Generate HTML report
        run: |
          mkdir -p out
          if ls logs/*.gz >/dev/null 2>&1; then
            zcat logs/*.gz | goaccess - \
              --log-format=CLOUDFRONT \
              --anonymize-ip \
              --no-progress \
              --output=out/index.html
          else
            echo "No logs yet; emitting placeholder report."
            cat > out/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><title>analytics — no data yet</title></head>
          <body style="font-family:Cascadia Code,monospace;padding:2rem;background:#0d0d10;color:#f2ede4">
          <h1>no log data yet</h1>
          <p>The log bucket is empty. CloudFront standard logs deliver in batches every few minutes; first delivery can take an hour after enable.</p>
          </body></html>
          HTML
          fi

      - name: Generate daily rollup JSON (goaccess + resume metrics)
        run: |
          if ls logs/*.gz >/dev/null 2>&1; then
            # General goaccess summary covers everything across the bucket.
            zcat logs/*.gz | goaccess - \
              --log-format=CLOUDFRONT \
              --anonymize-ip \
              --no-progress \
              --output=out/today.json

            # /resume.pdf-specific metrics. CloudFront log fields are
            # tab-separated; column 5 = c-ip, 8 = cs-uri-stem, 9 = sc-status.
            # 200 + 206 are real downloads (some PDF clients use Range
            # requests). 403 is the bot-block result from our edge fn.
            # The 30-pattern UA filter in edge.js means anything reaching
            # 200/206 here was a browser, so unique-IP count is "unique
            # humans" within UA-filter precision.
            zcat logs/*.gz | awk -F'\t' '!/^#/ && $8 == "/resume.pdf"' > /tmp/resume.tsv
            r_total=$(wc -l < /tmp/resume.tsv | tr -d ' ')
            r_ok=$(awk -F'\t' '$9 == "200" || $9 == "206"' /tmp/resume.tsv | wc -l | tr -d ' ')
            r_blocked=$(awk -F'\t' '$9 == "403"' /tmp/resume.tsv | wc -l | tr -d ' ')
            r_uniq=$(awk -F'\t' '($9 == "200" || $9 == "206") {print $5}' /tmp/resume.tsv | sort -u | wc -l | tr -d ' ')

            jq --argjson total "$r_total" \
               --argjson ok "$r_ok" \
               --argjson blocked "$r_blocked" \
               --argjson uniq "$r_uniq" \
               '.resume = {
                  total_requests: $total,
                  successful_downloads: $ok,
                  blocked_bots: $blocked,
                  unique_human_ips: $uniq
                }' \
               out/today.json > out/today-merged.json
            mv out/today-merged.json out/today.json

            # Resume fallback page hits (rewrite from /resume.pdf for bots).
            # Counts as "blocked_bots" since the only path to that URL is
            # the edge function rewrite. We add to the existing count.
            r_fallback=$(zcat logs/*.gz | awk -F'\t' '!/^#/ && $8 == "/resume-fallback/index.html" && $9 == "200"' | wc -l | tr -d ' ')
            jq --argjson f "$r_fallback" '.resume.fallback_views = $f' out/today.json > out/today-merged.json
            mv out/today-merged.json out/today.json

            echo "Resume rollup: total=$r_total ok=$r_ok blocked=$r_blocked unique_humans=$r_uniq fallback_views=$r_fallback"
          else
            echo '{"generated_at":"'"$(date -u +%FT%TZ)"'","note":"no log data yet","resume":{"total_requests":0,"successful_downloads":0,"blocked_bots":0,"unique_human_ips":0,"fallback_views":0}}' > out/today.json
          fi

          # Tag with today's date so historical rollups don't overwrite each other.
          DATESTAMP="$(date -u +%F)"
          cp out/today.json "out/${DATESTAMP}.json"
          ls -la out/

      - name: Compute first-party beacon metrics
        run: |
          # Parses CloudFront logs for hits on the long-named beacon path.
          # Each beacon GET carries the event type + page + target as a
          # query string, captured in column 12 (cs-uri-query). Aggregate
          # by event, by page, by click target, etc.
          python3 - <<'PY' > /tmp/behavior.json
          import gzip, glob, json, urllib.parse
          from collections import Counter

          EP = '/this-is-only-here-to-see-real-people-vs-robots-i-am-not-logging-all-your-shit-i-promise'

          total = 0
          by_event = Counter()
          by_page = {}
          by_click = Counter()
          by_section = Counter()
          by_outbound = Counter()
          downloads = 0

          for path in sorted(glob.glob('logs/*.gz')):
              with gzip.open(path, 'rt', errors='replace') as f:
                  for line in f:
                      if not line or line.startswith('#') or '\t' not in line:
                          continue
                      parts = line.rstrip('\n').split('\t')
                      if len(parts) < 12 or parts[7] != EP:
                          continue
                      query = parts[11] if parts[11] != '-' else ''
                      params = dict(urllib.parse.parse_qsl(query))
                      evt = params.get('evt', '')
                      if not evt:
                          continue
                      total += 1
                      by_event[evt] += 1
                      page = params.get('p', '')
                      if page:
                          if page not in by_page:
                              by_page[page] = Counter()
                          by_page[page][evt] += 1
                      if evt == 'click' and params.get('t'):
                          by_click[params['t']] += 1
                      elif evt == 'section' and params.get('s'):
                          by_section[params['s']] += 1
                      elif evt == 'outbound' and params.get('u'):
                          by_outbound[params['u']] += 1
                      elif evt == 'download':
                          downloads += 1

          out = {
              'total_beacons': total,
              'by_event': dict(by_event),
              'by_page': {k: dict(v) for k, v in by_page.items()},
              'by_click_target': dict(by_click.most_common(50)),
              'by_section': dict(by_section.most_common(50)),
              'by_outbound': dict(by_outbound.most_common(50)),
              'downloads': downloads,
          }
          print(json.dumps(out))
          PY

          BEHAVIOR=$(cat /tmp/behavior.json)
          jq --argjson b "$BEHAVIOR" '.behavior = $b' out/today.json > out/today-merged.json
          mv out/today-merged.json out/today.json

          DATESTAMP="$(date -u +%F)"
          cp out/today.json "out/${DATESTAMP}.json"

          echo "Behavior rollup: $(jq -r '.behavior.total_beacons' out/today.json) beacons, $(jq -r '.behavior.downloads' out/today.json) downloads"

      - name: Upload report + rollup to site bucket
        run: |
          DATESTAMP="$(date -u +%F)"

          # Latest report (overwritten daily):
          aws s3 cp out/index.html "s3://${{ secrets.AWS_SITE_BUCKET }}/admin/stats/index.html" \
            --cache-control "private, max-age=300" \
            --content-type "text/html; charset=utf-8"

          # Latest rollup (overwritten daily, used by trends page):
          aws s3 cp out/today.json "s3://${{ secrets.AWS_SITE_BUCKET }}/admin/data/latest.json" \
            --cache-control "private, max-age=300" \
            --content-type "application/json; charset=utf-8"

          # Per-day rollup (immutable once written, retained forever):
          aws s3 cp "out/${DATESTAMP}.json" "s3://${{ secrets.AWS_SITE_BUCKET }}/admin/data/daily/${DATESTAMP}.json" \
            --cache-control "private, max-age=31536000, immutable" \
            --content-type "application/json; charset=utf-8"

      - name: Build trends page from historical rollups
        run: |
          # Pull every per-day rollup we've ever produced. Tiny payload
          # (each JSON is single-digit KB), so we re-fetch all of them
          # daily rather than maintaining incremental state.
          mkdir -p history
          aws s3 sync "s3://${{ secrets.AWS_SITE_BUCKET }}/admin/data/daily/" ./history/ \
            --no-progress \
            --exclude "*" --include "*.json" || true

          if ! ls history/*.json >/dev/null 2>&1; then
            echo "No historical rollups yet (first run?); skipping trends page."
            exit 0
          fi

          python3 - <<'PY' > out/trends.html
          import datetime, glob, html, json, os, sys
          from collections import Counter

          rows = []
          # Lifetime aggregates that span all history.
          life_clicks = Counter()
          life_sections = Counter()
          life_outbound = Counter()
          life_pages = Counter()

          for path in sorted(glob.glob('history/*.json')):
              date = os.path.splitext(os.path.basename(path))[0]
              try:
                  with open(path) as f:
                      data = json.load(f)
              except Exception:
                  data = {}
              general = data.get('general', {}) if isinstance(data, dict) else {}
              total = int(general.get('total_requests') or 0)
              uniq = int(general.get('unique_visitors') or 0)
              failed = int(general.get('failed_requests') or 0)
              resume = data.get('resume', {}) if isinstance(data, dict) else {}
              r_total = int(resume.get('total_requests') or 0)
              r_ok = int(resume.get('successful_downloads') or 0)
              r_blocked = int(resume.get('blocked_bots') or 0)
              r_uniq = int(resume.get('unique_human_ips') or 0)
              behavior = data.get('behavior', {}) if isinstance(data, dict) else {}
              by_event = behavior.get('by_event', {}) or {}
              b_views = int(by_event.get('view') or 0)
              b_clicks = int(by_event.get('click') or 0)
              b_sections = int(by_event.get('section') or 0)
              b_outbound = int(by_event.get('outbound') or 0)
              b_downloads = int(behavior.get('downloads') or 0)
              for label, n in (behavior.get('by_click_target') or {}).items():
                  life_clicks[label] += int(n or 0)
              for s, n in (behavior.get('by_section') or {}).items():
                  life_sections[s] += int(n or 0)
              for u, n in (behavior.get('by_outbound') or {}).items():
                  life_outbound[u] += int(n or 0)
              for p, evts in (behavior.get('by_page') or {}).items():
                  if isinstance(evts, dict):
                      life_pages[p] += int(evts.get('view') or 0)
              rows.append({
                  'date': date,
                  'total': total, 'uniq': uniq, 'failed': failed,
                  'r_total': r_total, 'r_ok': r_ok,
                  'r_blocked': r_blocked, 'r_uniq': r_uniq,
                  'b_views': b_views, 'b_clicks': b_clicks,
                  'b_sections': b_sections, 'b_outbound': b_outbound,
                  'b_downloads': b_downloads,
              })

          if not rows:
              print('<!doctype html><title>no data</title><body>no rollups yet</body>')
              sys.exit(0)

          n = len(rows)
          width = 600
          height = 80
          step = width / max(1, n - 1) if n > 1 else 0

          def sparkline_points(values):
              peak = max(values) or 1
              return ' '.join(
                  f'{i * step:.1f},{height - (values[i] / peak) * (height - 6) - 3:.1f}'
                  for i in range(n)
              ), peak

          totals = [r['total'] for r in rows]
          traffic_points, traffic_peak = sparkline_points(totals)

          downloads = [r['r_ok'] for r in rows]
          dl_points, dl_peak = sparkline_points(downloads)
          dl_lifetime = sum(downloads)
          bots_lifetime = sum(r['r_blocked'] for r in rows)

          views = [r['b_views'] for r in rows]
          views_points, views_peak = sparkline_points(views)
          views_lifetime = sum(views)
          clicks_lifetime = sum(r['b_clicks'] for r in rows)
          sections_lifetime = sum(r['b_sections'] for r in rows)
          outbound_lifetime = sum(r['b_outbound'] for r in rows)
          dl_intent_lifetime = sum(r['b_downloads'] for r in rows)

          last_date = rows[-1]['date']
          today_iso = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')

          traffic_rows = '\n'.join(
              f'<tr><td>{html.escape(r["date"])}</td>'
              f'<td class="num">{r["total"]:,}</td>'
              f'<td class="num">{r["uniq"]:,}</td>'
              f'<td class="num dim">{r["failed"]:,}</td></tr>'
              for r in reversed(rows)
          )
          resume_rows = '\n'.join(
              f'<tr><td>{html.escape(r["date"])}</td>'
              f'<td class="num">{r["r_ok"]:,}</td>'
              f'<td class="num">{r["r_uniq"]:,}</td>'
              f'<td class="num dim">{r["r_blocked"]:,}</td>'
              f'<td class="num dim">{r["r_total"]:,}</td></tr>'
              for r in reversed(rows)
          )

          engagement_rows = '\n'.join(
              f'<tr><td>{html.escape(r["date"])}</td>'
              f'<td class="num">{r["b_views"]:,}</td>'
              f'<td class="num">{r["b_clicks"]:,}</td>'
              f'<td class="num">{r["b_sections"]:,}</td>'
              f'<td class="num">{r["b_downloads"]:,}</td>'
              f'<td class="num dim">{r["b_outbound"]:,}</td></tr>'
              for r in reversed(rows)
          )

          def small_table(items, cols, limit=10):
              top = list(items.most_common(limit)) if hasattr(items, 'most_common') else list(items)[:limit]
              if not top:
                  return '<p class="dim small">no events recorded yet.</p>'
              return (
                  '<table class="mini"><thead><tr>'
                  + ''.join(f'<th>{html.escape(c)}</th>' for c in cols)
                  + '</tr></thead><tbody>'
                  + ''.join(
                      f'<tr><td>{html.escape(str(label))}</td><td class="num">{count:,}</td></tr>'
                      for label, count in top
                  )
                  + '</tbody></table>'
              )

          top_clicks_html = small_table(life_clicks, ['click target', 'count'])
          top_sections_html = small_table(life_sections, ['section', 'views'])
          top_outbound_html = small_table(life_outbound, ['outbound host/path', 'count'])
          top_pages_html = small_table(life_pages, ['page', 'views'])

          print(f'''<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="noindex,nofollow">
          <title>piercemoore - analytics trends</title>
          <style>
            html, body {{ margin: 0; background: #0d0d10; color: #f2ede4; }}
            body {{ font-family: 'Cascadia Code', ui-monospace, monospace; padding: 2.5rem 1.5rem; max-width: 760px; margin: 0 auto; }}
            h1 {{ font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 900; font-size: 2.5rem; margin: 0 0 0.5rem; letter-spacing: -0.02em; }}
            h2 {{ font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 600; font-size: 1.5rem; margin: 3rem 0 1rem; letter-spacing: -0.01em; }}
            h3 {{ font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 500; font-size: 1.0625rem; margin: 0 0 0.5rem; letter-spacing: -0.005em; }}
            .grid-2 {{ display: grid; grid-template-columns: 1fr; gap: 2rem; margin-top: 2rem; }}
            @media (min-width: 700px) {{ .grid-2 {{ grid-template-columns: 1fr 1fr; gap: 2.5rem; }} }}
            table.mini {{ margin-top: 0; font-size: 0.75rem; }}
            table.mini th {{ font-size: 0.625rem; }}
            .small {{ font-size: 0.75rem; }}
            .subtitle {{ color: #8d877f; font-size: 0.875rem; }}
            .nav {{ margin: 1.5rem 0 2.5rem; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; }}
            .nav a {{ color: #ffb000; text-decoration: none; margin-right: 1.5rem; }}
            .nav a:hover {{ text-decoration: underline; }}
            svg {{ display: block; margin: 0 0 0.5rem; max-width: 100%; }}
            .sparkline {{ stroke: #ffb000; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }}
            table {{ width: 100%; border-collapse: collapse; margin-top: 1.5rem; font-size: 0.8125rem; }}
            th, td {{ text-align: left; padding: 0.5rem 1rem 0.5rem 0; border-bottom: 1px solid rgba(242, 237, 228, 0.07); }}
            th {{ color: #8d877f; font-weight: 400; text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.6875rem; }}
            .num {{ font-variant-numeric: tabular-nums; text-align: right; padding-right: 1.25rem; }}
            .dim {{ color: #8d877f; }}
            .meta {{ color: #5a5a5a; font-size: 0.75rem; margin-top: 3rem; }}
            .lifetime {{ color: #ffb000; }}
          </style>
          </head>
          <body>
            <h1>analytics - trends</h1>
            <div class="subtitle">{n} days of rollups, last update {html.escape(last_date)}</div>

            <div class="nav">
              <a href="/admin/stats/">latest goaccess report</a>
              <a href="/">return home</a>
            </div>

            <h2>site traffic</h2>
            <svg viewBox="0 0 {width} {height}" width="{width}" height="{height}" role="img" aria-label="total requests per day, last {n} days">
              <polyline class="sparkline" points="{traffic_points}" />
            </svg>
            <div class="subtitle">total requests / day &middot; peak {traffic_peak:,}</div>

            <table>
              <thead>
                <tr>
                  <th>date</th>
                  <th class="num">requests</th>
                  <th class="num">unique</th>
                  <th class="num">failed</th>
                </tr>
              </thead>
              <tbody>
              {traffic_rows}
              </tbody>
            </table>

            <h2>résumé downloads</h2>
            <svg viewBox="0 0 {width} {height}" width="{width}" height="{height}" role="img" aria-label="successful résumé downloads per day, last {n} days">
              <polyline class="sparkline" points="{dl_points}" />
            </svg>
            <div class="subtitle">human downloads / day &middot; peak {dl_peak:,} &middot; <span class="lifetime">lifetime: {dl_lifetime:,} downloads, {bots_lifetime:,} bots blocked</span></div>

            <table>
              <thead>
                <tr>
                  <th>date</th>
                  <th class="num">downloads</th>
                  <th class="num">unique humans</th>
                  <th class="num">bots blocked</th>
                  <th class="num">total hits</th>
                </tr>
              </thead>
              <tbody>
              {resume_rows}
              </tbody>
            </table>

            <h2>site engagement</h2>
            <svg viewBox="0 0 {width} {height}" width="{width}" height="{height}" role="img" aria-label="js-confirmed page views per day, last {n} days">
              <polyline class="sparkline" points="{views_points}" />
            </svg>
            <div class="subtitle">js-confirmed page views / day &middot; peak {views_peak:,} &middot; <span class="lifetime">lifetime: {views_lifetime:,} views, {clicks_lifetime:,} clicks, {sections_lifetime:,} section reads, {dl_intent_lifetime:,} download attempts, {outbound_lifetime:,} outbound clicks</span></div>

            <table>
              <thead>
                <tr>
                  <th>date</th>
                  <th class="num">views</th>
                  <th class="num">clicks</th>
                  <th class="num">sections</th>
                  <th class="num">downloads</th>
                  <th class="num">outbound</th>
                </tr>
              </thead>
              <tbody>
              {engagement_rows}
              </tbody>
            </table>

            <div class="grid-2">
              <div>
                <h3>top pages</h3>
                {top_pages_html}
              </div>
              <div>
                <h3>top click targets</h3>
                {top_clicks_html}
              </div>
              <div>
                <h3>top sections read</h3>
                {top_sections_html}
              </div>
              <div>
                <h3>top outbound</h3>
                {top_outbound_html}
              </div>
            </div>

            <div class="meta">generated {html.escape(today_iso)} - server-side rollup, no client-side js for tracking, ips anonymized at /24. /resume.pdf gated by user-agent filter at the cdn edge; "unique humans" counts distinct ips that received a 200/206 response. site engagement counts come from a first-party beacon at /this-is-only-here-to-see-real-people-vs-robots-i-am-not-logging-all-your-shit-i-promise — JS execution required, so bots that don't run JS never appear in these counts.</div>
          </body>
          </html>''')
          PY

          aws s3 cp out/trends.html "s3://${{ secrets.AWS_SITE_BUCKET }}/admin/trends/index.html" \
            --cache-control "private, max-age=300" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate /admin/* on CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_DISTRIBUTION_ID }} \
            --paths "/admin/stats/*" "/admin/data/*" "/admin/trends/*"
