kind: vibe-policy
schema_version: 1

project:
  name: piercemoore.com
  lifecycle: brownfield
  stack: astro5-typescript
  decisions: []

workflow:
  default_autonomy_mode: interactive
  changelog_required: true
  commit_per_logical_step: true
  signed_commits_required: true
  push_after_each_commit_if_remote_exists: true
  validation_command: make validate
  final_verification_command: make check-if-the-agent-can-consider-this-task-completed
  ask_before_dockerizing: true

quality_gates:
  lint:
    # No linter is wired for this repo (no eslint/prettier/biome config,
    # no lint script in package.json). Astro's correctness checking is
    # `astro check` — surfaced via the typecheck gate below. Required is
    # false because a `make lint` that fails closed would block every
    # commit for a gate the repo intentionally does not run.
    required: false
    command: make lint
  typecheck:
    # Real: `make typecheck` runs `astro check` (the repo's correctness
    # gate per AGENTS.md §3), which type-checks .astro/.ts across the tree.
    required: true
    command: make typecheck
  tests:
    mode: deferred
    command:
    required_suites: []
    coverage:
      enabled: false
      minimum_percentage:
  clean_worktree_required_on_completion: true

architecture:
  check_command: make check-architecture
  scope_globs:
    - "src/**/*"
  exclude_globs:
    - "**/*.generated.*"
    - "**/node_modules/**"
    - "dist/**"
  max_lines_per_file:
    soft: 250
    hard: 400
  max_public_functions_per_module: 8

docs:
  agents_md_required: true
  claude_md_required: true
  task_state_required: false
  vibe_yaml_required: true

reporting:
  completion_report:
    required: true
    format: markdown-table
    detail_level: compact

security:
  secrets_in_files: forbidden  # pragma: allowlist secret

versioning:
  # Repo-specific override of the skeleton default (which is a VERSION
  # file + per-commit bump). This site pins its version in package.json
  # as a PRODUCT-DISPLAY constant — the footer renders it dynamically via
  # PACKAGE_VERSION (AGENTS.md §5). It is not a per-commit-bumped semver,
  # so there is no VERSION file and bump_required_per_commit is false. The
  # pre-commit version-bump hook is intentionally omitted to match this.
  enabled: true
  style: semver
  file: package.json
  initial: "1.0.0"
  bump_required_per_commit: false
  changelog_path: CHANGELOG.md
  tag_prefix: "v"
skills:
  - id: agentic-skeleton
    version: "0.48.0"
    applied: '2026-09-06'
    source: sync
